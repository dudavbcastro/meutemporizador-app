<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu temporizador</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a33ce7">
</head>
<body>
    <h1>Temporizador</h1>
    <p id="timer">20:00</p>
<div class="config">
    <label for="minutos-input">Minutos:</label>
    <input type="number" id="minutos-input" value="20" min="0" max="120" step="1">
    <label for="segundos-input">Segundos:</label>
    <input type="number" id="segundos-input" value="0" min="0" max="59" step="1">
</div>
<div class="botoes">
    <button id="iniciar">Iniciar</button>
    <button id="pausar">Pausar</button>
    <button id="resetar">Resetar</button>
</div>
<audio id="som-alarme" src="alarme.mp3"></audio>
<script src="script.js"></script>
</body>
</html>
